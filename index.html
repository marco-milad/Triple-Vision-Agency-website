<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Triple Vision Agency - Your partner in branding, media production, photography, web design, and digital marketing solutions.">
  <meta name="keywords" content="branding, media production, photography, web design, digital marketing, event management, social media">
  <meta name="author" content="Triple Vision Agency">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Triple Vision Agency | Branding & Digital Marketing">
  <meta property="og:description" content="Digital agency crafting impactful, user-centric experiences with cutting-edge design and technology.">
  <meta property="og:type" content="website">
  
  <title>Triple Vision Agency | Branding & Digital Marketing</title>
  
  <!-- Favicon -->
  <!-- <link rel="icon" href="./images/logo2.png" type="image/x-icon"> -->
  
  <!-- Google Fonts (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Main Content -->
  <main>
    <!-- Hero Section -->
    <section class="hero-section" id="home">
      <div class="hero-container">
        
        <!-- Parent (Lines + Subtitle) -->
        <div class="parent animate">
          <div class="line"></div>
          <h2 class="hero-subtitle">TRIPLE VISION AGENCY</h2>
          <div class="line"></div>
        </div>

        <!-- Hero Title -->
        <h1 class="hero-title animate delay-1">DIGITAL MARKETING AGENCY</h1>

        <!-- Hero Text -->
        <p class="hero-text animate delay-2">
          Digital agency crafting impactful, user-centric experiences with cutting-edge design and technology for maximum success. Innovative digital agency crafting impactful solutions.
        </p>

        <!-- Hero Buttons -->
        <div class="hero-buttons animate delay-3">
          <a href="./contact.html" class="custom-btn" aria-label="Contact us">Contact Us</a>
          <a href="#about" class="btn-outline-dark" aria-label="Learn more about us">Learn More</a>
        </div>

      </div>

      <!-- Hero Video -->
      <div class="hero-video">
        <div class="video-card">
          <video 
            id="heroVideo" 
            autoplay 
            loop 
            muted
            playsinline 
            webkit-playsinline
            aria-label="Triple Vision Agency intro video">
            <source
              src="https://res.cloudinary.com/dcui0elwh/video/upload/v1763940851/Intro_dlaeds.mp4"
              type="video/mp4">
            Your browser does not support video playback.
          </video>

          <!-- Video Overlay -->
          <div class="video-overlay"></div>

          <!-- Mute Button -->
          <button id="muteIcon" class="mute-indicator" aria-label="Toggle video sound">🔇</button>
        </div>
      </div>

    </section>
  </main>

  <!-- JavaScript -->
  <script type="module" src="./js/main.js"></script>
  
</body>
</html>
